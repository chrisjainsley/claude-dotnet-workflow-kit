<title>{{PAGETITLE}}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --paper: #F5F6F8; --card: #FFFFFF; --ink: #1C2330; --muted: #5C6774; --line: #D8DDE4;
  --accent: #0E6F86; --accent-soft: #E0F0F4; --warn: #B4650E; --warn-soft: #FBF1E3; --bad: #B3261E; --bad-soft: #FBE7E5; --ok: #2E7D4F; --ok-soft: #E3F3E8;
  --code-bg: #EEF1F4; --hl-kw: #0E6F86; --hl-str: #8A4A0B; --hl-cm: #7A8491; --hl-ty: #5B3E9E; --hl-num: #A0361F;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #131820; --card: #1A2029; --ink: #E4E8EE; --muted: #98A3B1; --line: #2A3341;
    --accent: #52B7CF; --accent-soft: #16323A; --warn: #E09A4A; --warn-soft: #2E2416; --bad: #F08A80; --bad-soft: #3A1F1D; --ok: #6FCF97; --ok-soft: #1B3326;
    --code-bg: #10151C; --hl-kw: #6CC9DE; --hl-str: #E0A66B; --hl-cm: #7B879A; --hl-ty: #B39DEB; --hl-num: #F08A6E;
  }
}
:root[data-theme="dark"] {
  --paper: #131820; --card: #1A2029; --ink: #E4E8EE; --muted: #98A3B1; --line: #2A3341;
  --accent: #52B7CF; --accent-soft: #16323A; --warn: #E09A4A; --warn-soft: #2E2416; --bad: #F08A80; --bad-soft: #3A1F1D; --ok: #6FCF97; --ok-soft: #1B3326;
  --code-bg: #10151C; --hl-kw: #6CC9DE; --hl-str: #E0A66B; --hl-cm: #7B879A; --hl-ty: #B39DEB; --hl-num: #F08A6E;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 15px/1.55 var(--sans); margin: 0; }
a { color: var(--accent); }
.topbar { border-bottom: 1px solid var(--line); background: var(--card); padding: 18px 28px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 22px; }
.topbar h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.topbar .ticket { font-family: var(--mono); font-size: 13px; color: var(--accent); }
.topbar .kind { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); }
.chip-key { text-transform: uppercase; letter-spacing: 0.08em; font-size: 10.5px; margin-right: 6px; color: var(--muted); }
.chip code { font-size: 12px; }
.layout { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 0 36px; margin: 0 auto; padding: 28px 28px 80px; }
.layout.kind-plan { max-width: 1180px; }
.layout.kind-review { max-width: 1240px; }
nav.rail { position: sticky; top: 24px; align-self: start; display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
nav.rail a { color: var(--muted); text-decoration: none; padding: 5px 10px; border-left: 2px solid var(--line); }
nav.rail a.active { color: var(--ink); border-left-color: var(--accent); font-weight: 600; }
nav.rail a:hover { color: var(--ink); }
main { min-width: 0; }
.kind-plan main { max-width: 78ch; }
.kind-review main { max-width: 88ch; }
.plan-section { padding: 22px 0 26px; border-bottom: 1px solid var(--line); }
.plan-section:last-child { border-bottom: 0; }
.section-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.section-head h2 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -0.005em; }
.onion { width: 30px; height: 30px; flex: none; }
.onion .ring { fill: none; stroke: var(--line); stroke-width: 2; }
.onion .ring.active { fill: var(--accent-soft); stroke: var(--accent); }
.kind-plan h3 { font-size: 14px; font-weight: 600; margin: 16px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.kind-review h3 { font-size: 14px; font-weight: 600; margin: 18px 0 6px; color: var(--ink); }
h4 { font-size: 14px; font-weight: 600; margin: 14px 0 6px; }
p { margin: 0 0 10px; }
ul, ol { margin: 0 0 10px; padding-left: 22px; }
li { margin: 4px 0; }
li > ul { margin-top: 4px; }
code { font-family: var(--mono); font-size: 0.88em; background: var(--code-bg); padding: 1px 5px; border-radius: 3px; }
pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; overflow-x: auto; margin: 10px 0 14px; font-size: 12.5px; line-height: 1.5; }
pre code { background: none; padding: 0; font-size: inherit; }
pre.mermaid { background: var(--card); text-align: center; }
figure.diagram { margin: 10px 0 14px; cursor: zoom-in; }
figure.diagram pre.mermaid { margin: 0; }
figure.diagram figcaption { display: flex; justify-content: flex-end; margin-top: 4px; }
.diagram-open, .diagram-close { font: 600 12px/1 var(--sans); color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 4px; padding: 5px 9px; cursor: pointer; }
.diagram-open:hover, .diagram-close:hover, .diagram-open:focus-visible, .diagram-close:focus-visible { color: var(--accent); border-color: var(--accent); outline: none; }
dialog.diagram-modal { width: 96vw; max-width: none; height: 94vh; max-height: none; margin: auto; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); display: none; flex-direction: column; }
dialog.diagram-modal[open] { display: flex; }
dialog.diagram-modal::backdrop { background: rgba(10, 14, 20, 0.6); }
dialog.diagram-modal .diagram-bar { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
dialog.diagram-modal .diagram-bar span { flex: 1; }
dialog.diagram-modal .diagram-body { flex: 1; overflow: auto; padding: 16px; }
dialog.diagram-modal .diagram-body pre.mermaid { border: 0; margin: 0; min-height: 100%; }
dialog.diagram-modal .diagram-body svg { max-width: none !important; width: 100%; height: auto; }
.table-wrap { overflow-x: auto; margin: 8px 0 14px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 6px 10px; border-bottom: 1px solid var(--line); font-weight: 600; }
td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.kind-plan td:first-child { white-space: nowrap; color: var(--muted); }
.figures { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin: 10px 0 14px; }
.figures figure { margin: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--code-bg); }
.figures img { display: block; width: 100%; height: auto; }
.figures figcaption { font-size: 12px; color: var(--muted); padding: 6px 10px; border-top: 1px solid var(--line); }
.figures figure.missing figcaption { color: var(--warn); border-top: 0; }
figure.design { margin: 10px 0 14px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--card); cursor: zoom-in; }
figure.design .design-frame { position: relative; overflow: hidden; }
figure.design iframe { border: 0; display: block; transform-origin: top left; pointer-events: none; background: #fff; }
figure.design figcaption { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); padding: 6px 10px; border-top: 1px solid var(--line); }
figure.design figcaption span { flex: 1; }
dialog.diagram-modal .diagram-body iframe { border: 0; display: block; background: #fff; }
.opt { display: flex; gap: 12px; align-items: flex-start; padding: 10px 14px; border: 1px solid var(--line); border-radius: 6px; margin: 6px 0; cursor: pointer; }
.kind-plan .opt { background: var(--card); }
.kind-review .opt { background: var(--paper); }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt input[type="radio"] { margin: 3px 0 0; accent-color: var(--accent); flex: none; }
.opt-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.opt-label { font-weight: 600; font-size: 14px; }
.opt-detail { color: var(--muted); font-size: 13px; }
.qsub { color: var(--muted); font-size: 13.5px; margin: 0 0 10px; }
.qfoot { display: flex; align-items: center; gap: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.qstatus { flex: 1; }
.hint { font-size: 12.5px; color: var(--muted); margin-top: 10px; }
.attribution { border-top: 1px solid var(--line); background: var(--card); color: var(--muted); font-size: 12.5px; padding: 14px 28px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.attribution .wordmark { font-weight: 600; letter-spacing: -0.01em; color: var(--ink); text-decoration: none; }
.attribution .wordmark:hover { color: var(--accent); }
.attribution .sep { color: var(--line); }
.hljs-keyword, .hljs-built_in, .hljs-literal, .hljs-selector-tag { color: var(--hl-kw); }
.hljs-string, .hljs-attr, .hljs-symbol { color: var(--hl-str); }
.hljs-comment, .hljs-meta { color: var(--hl-cm); }
.hljs-title, .hljs-type, .hljs-class .hljs-title { color: var(--hl-ty); }
.hljs-number { color: var(--hl-num); }

/* plan page */
details.context { border: 1px solid var(--line); border-radius: 6px; background: var(--card); padding: 0; }
details.context summary { cursor: pointer; padding: 10px 14px; font-size: 13.5px; color: var(--muted); list-style: none; display: flex; align-items: center; gap: 8px; }
details.context summary::-webkit-details-marker { display: none; }
details.context summary::before { content: ""; width: 6px; height: 6px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(-45deg); transition: transform 120ms; }
details.context[open] summary::before { transform: rotate(45deg); }
details.context[open] summary { border-bottom: 1px solid var(--line); color: var(--ink); }
details.context > *:not(summary) { margin-left: 14px; margin-right: 14px; }
details.context > p:first-of-type { margin-top: 12px; }
details.context > *:last-child { margin-bottom: 14px; }
.qform { display: flex; flex-direction: column; gap: 18px; }
fieldset.q { border: 0; margin: 0; padding: 0 0 0 44px; position: relative; min-width: 0; }
fieldset.q legend { padding: 0; font-weight: 600; font-size: 15px; display: block; margin-bottom: 4px; }
.qnum { position: absolute; left: 0; top: 0; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--warn); color: var(--warn); font-family: var(--mono); font-size: 12px; display: flex; align-items: center; justify-content: center; }
.badge { display: inline-block; margin-left: 8px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; padding: 1px 6px; border: 1px solid var(--accent); color: var(--accent); border-radius: 3px; vertical-align: 2px; font-weight: 600; }
.opt.other { align-items: center; }
.other-text, .qform textarea { font: inherit; font-size: 14px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 5px; padding: 8px 10px; width: 100%; }
.other-text { flex: 1; }
.qform textarea { resize: vertical; }
.other-text:focus, .qform textarea:focus, .qform button:focus-visible, .opt input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.qform button { font: inherit; font-weight: 600; font-size: 14px; color: var(--paper); background: var(--accent); border: 0; border-radius: 5px; padding: 8px 16px; cursor: pointer; }
.qform button[disabled] { opacity: 0.6; cursor: default; }
#decisions .section-body ul > li { padding-left: 4px; }

/* review page */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 8px 0 14px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
.tile-metric { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.tile-value { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; margin: 2px 0; }
.tile-note { font-size: 12px; color: var(--muted); }
.pill { display: inline-block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; padding: 1px 7px; border-radius: 3px; border: 1px solid var(--line); color: var(--muted); background: var(--card); }
.pill-done, .pill-fixed, .pill-pass, .pill-low, .pill-info { color: var(--ok); border-color: var(--ok); background: var(--ok-soft); }
.pill-changed, .pill-accepted, .pill-medium, .pill-blocked { color: var(--warn); border-color: var(--warn); background: var(--warn-soft); }
.pill-dropped, .pill-open, .pill-high, .pill-fail { color: var(--bad); border-color: var(--bad); background: var(--bad-soft); }
details.hunk { border: 1px solid var(--line); border-radius: 6px; background: var(--card); margin: 8px 0; }
details.hunk summary { cursor: pointer; padding: 9px 14px; font-size: 13.5px; font-weight: 600; list-style: none; display: flex; align-items: center; gap: 8px; }
details.hunk summary::-webkit-details-marker { display: none; }
details.hunk summary::before { content: ""; width: 6px; height: 6px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(-45deg); }
details.hunk[open] summary::before { transform: rotate(45deg); }
details.hunk pre { margin: 0; border: 0; border-top: 1px solid var(--line); border-radius: 0 0 6px 6px; }
a.filelink { color: inherit; text-decoration: none; }
a.filelink code { text-decoration: underline dotted; text-underline-offset: 2px; cursor: pointer; }
a.filelink:hover code { background: var(--panel); }
.filediffs { margin-top: 18px; }
details.filediff summary code { background: none; padding: 0; font-weight: 600; font-size: 12.5px; word-break: break-all; }
details.filediff summary .fstat { margin-left: auto; font-family: var(--mono); font-size: 12px; font-weight: 400; white-space: nowrap; }
details.filediff summary .fadd { color: var(--ok); }
details.filediff summary .fdel { color: var(--bad); }
details.filediff summary a.gh { font-size: 12px; font-weight: 400; color: var(--muted); text-decoration: underline; white-space: nowrap; }
details.filediff:target { outline: 2px solid var(--accent, var(--muted)); outline-offset: 2px; }
.fnote { margin: 0; padding: 10px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
.hljs-addition { color: var(--ok); background: var(--ok-soft); display: inline-block; width: 100%; }
.hljs-deletion { color: var(--bad); background: var(--bad-soft); display: inline-block; width: 100%; }
.scenario-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 18px; padding-top: 12px; border-top: 1px dashed var(--line); }
.scenario-title span:first-child { flex: 1; min-width: 200px; }
.qa-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-right: 6px; }
.qa-evidence, .qa-classification, .qa-not { font-size: 13.5px; }
.qa-not { padding: 10px 14px; background: var(--warn-soft); border-left: 3px solid var(--warn); margin-top: 12px; }
.steps { background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 0; margin: 10px 0 14px; font-family: var(--mono); font-size: 12.5px; line-height: 1.5; overflow-x: auto; }
.steps .step, .steps .step-other { padding: 2px 14px 2px 28px; }
.steps .step-other { color: var(--muted); padding-left: 14px; }
.steps .kw { color: var(--hl-kw); font-weight: 500; }
.steps details.step { padding: 0; }
.steps details.step > summary { cursor: pointer; list-style: none; display: flex; align-items: baseline; gap: 8px; padding: 2px 14px 2px 28px; }
.steps details.step > summary::-webkit-details-marker { display: none; }
.steps details.step > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.steps details.step > summary > span:first-child { flex: 1; }
.steps .ev-count { flex: none; font: 600 10.5px/1 var(--sans); text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); white-space: nowrap; border: 1px solid var(--line); border-radius: 999px; padding: 3px 8px; }
.steps details.step > summary:hover .ev-count { border-color: var(--accent); }
.steps details.step[open] .ev-count { background: var(--accent-soft); border-color: var(--accent); }
.steps details.step[open] { background: var(--card); border-block: 1px solid var(--line); margin: 4px 0; }
.steps details.step > .evidence-item, .steps details.step > .figures { margin: 6px 14px 10px 28px; font-family: var(--sans); }
.evidence-item pre { margin: 4px 0 0; }
details.evidence > .evidence-item, details.evidence > .figures { margin: 0 14px 12px; }
.figures.qa-media { grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 14px; align-items: start; }
.qa-media figure.shot { cursor: zoom-in; }
.qa-media figure.video video { display: block; width: 100%; height: auto; background: #000; }
.qa-media figcaption .kw { color: var(--hl-kw); font-weight: 600; }
.http-pair { display: flex; flex-direction: column; gap: 8px; }
.http-pane { border: 1px solid var(--line); border-radius: 6px; background: var(--card); overflow: hidden; }
.http-pane pre { margin: 0; border: 0; border-radius: 0; }
.http-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 10px; border-bottom: 1px solid var(--line); }
.http-head .qa-label { margin: 0; }
.http-line { font-family: var(--mono); font-size: 12px; color: var(--ink); overflow-wrap: anywhere; }
dialog.diagram-modal .diagram-body img { display: block; max-width: 100%; height: auto; margin: 0 auto; }
.checklist { list-style: none; padding: 0; }
.checklist li { margin: 0; border-bottom: 1px solid var(--line); }
.checklist label { display: flex; gap: 12px; align-items: flex-start; padding: 9px 4px; cursor: pointer; }
.checklist input { margin-top: 4px; accent-color: var(--accent); }
.checklist input:checked + span { color: var(--muted); text-decoration: line-through; }
.dform { display: flex; flex-direction: column; gap: 16px; margin-top: 12px; }
fieldset.d { border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px 14px; margin: 0; background: var(--card); }
fieldset.d legend { padding: 0 6px; font-weight: 600; font-size: 13.5px; }
.opt.inline { display: inline-flex; margin-right: 8px; padding: 7px 12px; align-items: center; }
.opt.inline input[type="radio"] { margin: 0; }
.dform textarea { font: inherit; font-size: 14px; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 5px; padding: 8px 10px; width: 100%; resize: vertical; margin-top: 8px; }
.dform button { font: inherit; font-weight: 600; font-size: 14px; color: var(--paper); background: var(--accent); border: 0; border-radius: 5px; padding: 8px 16px; cursor: pointer; }
.dform button[disabled] { opacity: 0.6; cursor: default; }
.dform textarea:focus, .dform button:focus-visible, .opt input:focus-visible, .checklist input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; padding: 18px 16px 60px; }
  nav.rail { position: static; flex-direction: row; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  nav.rail a { border-left: 0; border-bottom: 2px solid var(--line); padding: 4px 8px; }
  nav.rail a.active { border-bottom-color: var(--accent); }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>
{{BRAND_STYLE}}
<header class="topbar">
  <span class="kind">{{KINDLABEL}}</span>
  <span class="ticket">{{TICKET}}</span>
  <h1>{{TITLE}}</h1>
  <div class="chips">{{CHIPS}}</div>
</header>
<div class="layout kind-{{KIND}}">
  <nav class="rail" aria-label="Sections">{{NAV}}</nav>
  <main>
    {{SECTIONS}}
    <p class="hint">{{HINT}}</p>
  </main>
</div>
<dialog class="diagram-modal" id="diagram-modal" aria-label="Diagram, full size">
  <div class="diagram-bar"><span>Scroll to pan. Esc or click outside to close.</span><button type="button" class="diagram-close" id="diagram-close">Close</button></div>
  <div class="diagram-body" id="diagram-body"></div>
</dialog>

<script>
(function () {
  if (window.hljs) { document.querySelectorAll('pre code[class*="language-"]').forEach(function (el) { hljs.highlightElement(el); }); }

  var sections = Array.prototype.slice.call(document.querySelectorAll('.plan-section'));
  function setActive(id) { links.forEach(function (a) { a.classList.toggle('active', a.dataset.target === id); }); }
  if ('IntersectionObserver' in window) {
    var visible = {};
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { visible[e.target.id] = e.isIntersecting ? e.boundingClientRect.top : null; });
      var best = sections.filter(function (s) { return visible[s.id] !== null && visible[s.id] !== undefined; })
        .sort(function (a, b) { return Math.abs(visible[a.id]) - Math.abs(visible[b.id]); })[0];
      if (best) { setActive(best.id); }
    }, { rootMargin: '-15% 0px -70% 0px', threshold: 0 });
    sections.forEach(function (s) { io.observe(s); });
  }
  if (sections[0]) { setActive(sections[0].id); }
  function openTarget(hash) {
    if (!hash) { return; }
    var el = document.getElementById(hash.replace(/^#/, ''));
    if (el && el.tagName === 'DETAILS') { el.open = true; }
  }
  document.querySelectorAll('a.filelink').forEach(function (a) {
    a.addEventListener('click', function () { openTarget(a.getAttribute('href')); });
  });
  document.querySelectorAll('details.filediff a.gh').forEach(function (a) {
    a.addEventListener('click', function (e) { e.stopPropagation(); });
  });
  openTarget(location.hash);
  window.addEventListener('hashchange', function () { openTarget(location.hash); });
  function fitDesigns() {
    document.querySelectorAll('figure.design .design-frame').forEach(function (frame) {
      var iframe = frame.querySelector('iframe');
      if (!iframe) { return; }
      var w = parseInt(iframe.getAttribute('width'), 10);
      var h = parseInt(iframe.getAttribute('height'), 10);
      if (!w || !h || !frame.clientWidth) { return; }
      var s = Math.min(1, frame.clientWidth / w);
      iframe.style.transform = 'scale(' + s + ')';
      frame.style.height = Math.round(h * s) + 'px';
    });
  }
  fitDesigns();
  window.addEventListener('resize', fitDesigns);
  window.addEventListener('load', fitDesigns);
  document.querySelectorAll('details').forEach(function (d) { d.addEventListener('toggle', fitDesigns); });
  if ('ResizeObserver' in window) {
    // The column settles after fonts and the rail lay out; follow it rather than trust the first measure.
    var ro = new ResizeObserver(fitDesigns);
    document.querySelectorAll('figure.design .design-frame').forEach(function (frame) { ro.observe(frame); });
  }
  var modal = document.getElementById('diagram-modal');
  var modalBody = document.getElementById('diagram-body');
  if (modal && modalBody && typeof modal.showModal === 'function') {
    document.querySelectorAll('figure.diagram, figure.design, .qa-media figure.shot').forEach(function (fig) {
      fig.addEventListener('click', function (e) {
        var caption = fig.querySelector('figcaption');
        if (caption && caption.contains(e.target) && !e.target.classList.contains('diagram-open')) { return; }
        // Copy whatever the runtime has rendered by now (an svg, or the source before it runs)
        // and drop mermaid's inline max-width so the viewBox scales to the dialog.
        modalBody.innerHTML = '';
        Array.prototype.slice.call(fig.children).forEach(function (child) {
          if (child.tagName !== 'FIGCAPTION') { modalBody.appendChild(child.cloneNode(true)); }
        });
        modalBody.querySelectorAll('svg').forEach(function (svg) {
          svg.style.maxWidth = 'none';
          svg.removeAttribute('width');
          svg.removeAttribute('height');
        });
        // An artboard shows at its own size in the dialog; the column view scaled it down.
        modalBody.querySelectorAll('.design-frame').forEach(function (frame) {
          frame.style.height = 'auto';
          frame.style.overflow = 'visible';
          var iframe = frame.querySelector('iframe');
          if (iframe) { iframe.style.transform = 'none'; iframe.style.pointerEvents = 'auto'; }
        });
        modal.showModal();
      });
    });
    document.getElementById('diagram-close').addEventListener('click', function () { modal.close(); });
    modal.addEventListener('click', function (e) { if (e.target === modal) { modal.close(); } });
    modal.addEventListener('close', function () { modalBody.innerHTML = ''; });
  }
})();
(async function () {
  var qform = document.getElementById('qform');
  var dform = document.getElementById('dform');
  var boxes = Array.prototype.slice.call(document.querySelectorAll('.checklist input[type="checkbox"]'));
  if (!qform && !dform && !boxes.length) { return; }
  var qcount = document.getElementById('qcount');
  var qstatus = document.getElementById('qstatus');
  var qsend = document.getElementById('qsend');
  var dstatus = document.getElementById('dstatus');
  var dsend = document.getElementById('dsend');
  var sets = qform ? Array.prototype.slice.call(qform.querySelectorAll('fieldset.q')) : [];
  function answerOf(fs) {
    var ta = fs.querySelector('textarea');
    if (ta) { return ta.value.trim() ? { choice: null, text: ta.value.trim() } : null; }
    var checked = fs.querySelector('input[type="radio"]:checked');
    if (!checked) { return null; }
    if (checked.value === '__other__') {
      var t = fs.querySelector('.other-text').value.trim();
      return t ? { choice: 'other', text: t } : null;
    }
    return { choice: checked.value, text: '' };
  }
  function refresh() {
    if (!qcount) { return; }
    qcount.textContent = sets.filter(answerOf).length + '/' + sets.length + ' answered';
  }
  function apply(fs, a) {
    var ta = fs.querySelector('textarea');
    if (ta) { ta.value = a.text || ''; return; }
    var radios = Array.prototype.slice.call(fs.querySelectorAll('input[type="radio"]'));
    var target = a.choice === 'other' ? '__other__' : a.choice;
    radios.forEach(function (r) { r.checked = r.value === target; });
    if (a.choice === 'other') { fs.querySelector('.other-text').value = a.text || ''; }
  }
  if (qform) {
    qform.addEventListener('input', refresh);
    qform.addEventListener('change', refresh);
    sets.forEach(function (fs) {
      var other = fs.querySelector('.other-text');
      if (other) { other.addEventListener('focus', function () { fs.querySelector('input[value="__other__"]').checked = true; refresh(); }); }
    });
    refresh();
  }
  var db = (window.claude && typeof window.claude.use === 'function') ? await window.claude.use('db') : null;
  if (!db) {
    if (qsend) { qsend.hidden = true; }
    if (qstatus) { qstatus.textContent = 'Answer in chat by question number.'; }
    if (dsend) { dsend.hidden = true; }
    if (dstatus) { dstatus.textContent = 'Decide in chat; this view cannot save.'; }
    return;
  }
  if (qform) {
    try {
      var snap = await db.collection('answers').get();
      snap.docs.forEach(function (d) {
        var a = d.data();
        var fs = sets.filter(function (f) { return f.dataset.qid === d.id; })[0];
        if (fs && a) { apply(fs, a); }
      });
      refresh();
      if (!snap.empty && qstatus) { qstatus.textContent = 'Answers on file.'; }
    } catch (e) { if (qstatus) { qstatus.textContent = 'Saved answers could not be loaded.'; } }
    qform.addEventListener('submit', async function (e) {
      e.preventDefault();
      qsend.disabled = true;
      qstatus.textContent = 'Sending...';
      try {
        for (var i = 0; i < sets.length; i++) {
          var a = answerOf(sets[i]);
          if (!a) { continue; }
          await db.doc('answers/' + sets[i].dataset.qid).set({
            question: sets[i].dataset.title, choice: a.choice, text: a.text, answeredAt: new Date().toISOString()
          });
        }
        qstatus.textContent = 'Sent. Tell Claude "answered" to continue.';
      } catch (err) { qstatus.textContent = 'Send failed: ' + ((err && err.message) || err); }
      qsend.disabled = false;
    });
  }
  if (!dform && !boxes.length) { return; }
  try {
    if (boxes.length) {
      var rollout = await db.collection('rollout').get();
      rollout.docs.forEach(function (d) {
        var box = boxes.filter(function (b) { return b.dataset.step === d.id; })[0];
        if (box && d.data()) { box.checked = !!d.data().done; }
      });
    }
    if (dform) {
      var review = await db.collection('review').get();
      review.docs.forEach(function (d) {
        var a = d.data() || {};
        if (d.id === 'decision') {
          var v = dform.querySelector('input[name="verdict"][value="' + a.verdict + '"]');
          if (v) { v.checked = true; }
          dform.querySelector('textarea[name="notes"]').value = a.notes || '';
          if (dstatus) { dstatus.textContent = 'Decision on file: ' + (a.verdict === 'approve' ? 'approved' : 'changes requested') + '.'; }
        } else {
          var r = dform.querySelector('input[name="' + d.id + '"][value="' + a.action + '"]');
          if (r) { r.checked = true; }
        }
      });
    }
  } catch (e) { if (dstatus) { dstatus.textContent = 'Saved state could not be loaded.'; } }
  boxes.forEach(function (box) {
    box.addEventListener('change', async function () {
      try { await db.doc('rollout/' + box.dataset.step).set({ done: box.checked, at: new Date().toISOString() }); }
      catch (e) { box.checked = !box.checked; }
    });
  });
  if (!dform) { return; }
  dform.addEventListener('submit', async function (e) {
    e.preventDefault();
    var verdict = dform.querySelector('input[name="verdict"]:checked');
    if (!verdict) { dstatus.textContent = 'Pick approve or request changes first.'; return; }
    dsend.disabled = true;
    dstatus.textContent = 'Sending...';
    try {
      await db.doc('review/decision').set({ verdict: verdict.value, notes: dform.querySelector('textarea[name="notes"]').value.trim(), decidedAt: new Date().toISOString() });
      var findings = Array.prototype.slice.call(dform.querySelectorAll('fieldset.finding'));
      for (var i = 0; i < findings.length; i++) {
        var fid = findings[i].dataset.fid;
        var picked = findings[i].querySelector('input:checked');
        if (picked) { await db.doc('review/' + fid).set({ finding: findings[i].querySelector('legend').textContent, action: picked.value, decidedAt: new Date().toISOString() }); }
      }
      dstatus.textContent = 'Sent. Tell Claude "decided" to continue.';
    } catch (err) { dstatus.textContent = 'Send failed: ' + ((err && err.message) || err); }
    dsend.disabled = false;
  });
})();
